<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vyapar Setu — Intelligent Freight Forecasting &amp; Vessel Chartering Platform</title>
  
  <!-- Typography & Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/modules.css">
</head>
<body>
  <div id="app">
    
    <!-- Platform Header -->
    <header>
      <div class="brandrow">
        <div class="brand">
          <svg width="32" height="32" viewBox="0 0 30 30" fill="none">
            <path d="M4 21c2 2 4 2 6 0s4-2 6 0 4 2 6 0 4-2 4-2" stroke="#B9812E" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M15 4v13" stroke="#2A2016" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M15 6l7 3-7 8-7-8 7-3z" stroke="#2A2016" stroke-width="1.5" fill="none" stroke-linejoin="round"/>
          </svg>
          <div>
            <h1>Vyapar Setu <span class="version-tag">v5.0</span></h1>
            <div class="sub">Intelligent Freight Forecasting &amp; Vessel Chartering Platform — East Coast India</div>
          </div>
        </div>

        <div class="headright">
          <div class="headstats" id="headstats">
            <!-- Populated dynamically by app.js -->
          </div>
          <div class="head-actions">
            <button class="btn ghost small" id="btn-voice-qa-head">🎙️ Voice Q&amp;A</button>
            <button class="btn ghost small" id="btn-tender-head">📑 Tender Spec</button>
            <button class="btn brass" id="btn-new-contract">＋ New Contract</button>
          </div>
        </div>
      </div>
    </header>

    <!-- Multi-Module Tab Navigation Bar -->
    <div class="nav-tabs-wrapper">
      <nav class="nav-tabs">
        <button class="tab-btn active" data-tab="ledger-view">
          📜 Trade Ledger
        </button>
        <button class="tab-btn" data-tab="forecast-view">
          📈 Freight Forecast
        </button>
        <button class="tab-btn" data-tab="optimizer-view">
          ⚖️ MILP Optimizer
        </button>
        <button class="tab-btn" data-tab="pooling-view">
          🤝 Cross-PSU Pooling <span class="badge">COA</span>
        </button>
        <button class="tab-btn" data-tab="idle-view">
          ⚓ Idle Advisor
        </button>
        <button class="tab-btn" data-tab="vernacular-view">
          🎙️ Sarvam AI <span class="badge">Vernacular</span>
        </button>
        <button class="tab-btn" data-tab="tender-view">
          📑 Tender Spec
        </button>
        <button class="tab-btn" data-tab="backtest-view">
          📊 2-Yr Backtest
        </button>
      </nav>
    </div>

    <!-- Main View Workspace Area -->
    <main id="main-view">
      <div class="tab-view active" id="ledger-view"></div>
      <div class="tab-view" id="forecast-view"></div>
      <div class="tab-view" id="optimizer-view"></div>
      <div class="tab-view" id="pooling-view"></div>
      <div class="tab-view" id="idle-view"></div>
      <div class="tab-view" id="vernacular-view"></div>
      <div class="tab-view" id="tender-view"></div>
      <div class="tab-view" id="backtest-view"></div>
    </main>

    <!-- Footer Status Bar -->
    <footer>
      <div class="status-indicator">
        <span class="pulse-dot"></span>
        <span>VYAPAR SETU PLATFORM ONLINE · 7 EAST COAST PORTS MONITORED</span>
      </div>
      <div style="display:flex;align-items:center;gap:16px;">
        <span id="backend-status" style="font-size:11px;font-family:'IBM Plex Mono',monospace;cursor:pointer;color:#fbbf24;user-select:none;" title="Click to refresh backend status">● Demo Mode</span>
        <span class="mono" id="clock">REF DATE 2026-09-14</span>
      </div>
    </footer>

  </div>

  <!-- Toast Container & Modal Root -->
  <div id="toast-container"></div>
  <div id="modal-root"></div>

  <!-- JavaScript Modules & Data Store -->
  <script src="js/data/mockData.js"></script>
  <script src="js/modules/ledger.js"></script>
  <script src="js/modules/forecast.js"></script>
  <script src="js/modules/optimizer.js"></script>
  <script src="js/modules/pooling.js"></script>
  <script src="js/modules/idleAdvisor.js"></script>
  <script src="js/modules/vernacular.js"></script>
  <script src="js/modules/tender.js"></script>
  <script src="js/modules/backtest.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
